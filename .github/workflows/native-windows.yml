name: Native Windows
on:
  push:
    branches: ['codex/native-migration']
    paths: ['native/**', 'scripts/*native*', '.github/workflows/native-windows.yml', 'LICENSE']
    tags: ['native-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain and packager
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Format and release tests
        working-directory: native
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
      - name: Package native executable
        shell: pwsh
        run: ./scripts/package-native.ps1
      - name: Install, launch, uninstall and retain profile
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          # Hosted runners lack a desktop OpenGL driver. These DLLs are test-only,
          # injected after installation; they are never packaged in the release.
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-ci.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $archive
          $expected = 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa checksum mismatch' }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          New-Item -ItemType Directory -Path $mesa -Force | Out-Null
          tar -xf $archive -C $mesa x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract CI OpenGL driver' }
          $env:CI_SOFTWARE_OPENGL = Join-Path $mesa 'x64'
          ./scripts/test-native-installer.ps1
      - name: Signature status
        shell: pwsh
        run: Get-AuthenticodeSignature release/native/NIP-Native-Setup-*-x64.exe | Format-List Status,StatusMessage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nip-native-windows-x64-unsigned
          path: |
            release/native/NIP-Native-Setup-*-x64.exe
            release/native/SHA256SUMS.txt
            release/native/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
