name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - run: npm run test:installer
      - name: Checksum and signature status
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $exe = "release/NIP-Setup-$version-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  NIP-Setup-$version-x64.exe" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-AuthenticodeSignature $exe | Format-List Status, StatusMessage
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nip-windows-x64-unsigned
          path: |
            release/NIP-Setup-*-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag release/NIP-Setup-*-x64.exe release/SHA256SUMS.txt --verify-tag --title "NIP $tag - Windows x64" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
