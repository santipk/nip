[package]
name = "nip-native"
version = "0.3.0-beta.1"
edition = "2024"
license = "MIT"
publish = false
authors = ["Santiago Abregu"]
description = "NIP — llamadas y chat de amigos con servidores autohospedados"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
cpal = "=0.18.2"
opus = "=0.4.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
bytes = "1"
rtrb = "0.3"
rfd = { version = "=0.17.2", default-features = false }
fixed-resample = { version = "=0.13.0", default-features = false, features = ["resampler"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }
sonora = { version = "=0.3.0", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled", "backup"] }
age = { version = "=0.12.1", default-features = false }
tar = "=0.4.46"

[profile.release]
lto = "thin"
strip = true

# opusic-sys configures Release CMake definitions; MSVC Debug configuration mismatches
# its generated SIMD declarations. Keep only this C dependency optimized in dev.
[profile.dev.package.opusic-sys]
opt-level = 3
debug = false
debug-assertions = false

[build-dependencies]
winres = "=0.1.12"
