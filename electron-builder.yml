appId: com.santipk.nip
productName: NIP
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - LICENSE
  - README.md
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: NIP-Setup-${version}-${arch}.${ext}
  executableName: NIP
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  runAfterFinish: false
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: NIP
  uninstallDisplayName: NIP
  deleteAppDataOnUninstall: false
  license: LICENSE
  include: build/installer.nsh
  installerLanguages: [es_ES]
publish: null
